syntax = "proto3";

package storemesh.product.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "storemesh-product-service/gen/product/v1;productv1";

service ProductCatalogService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse) {
    option (google.api.http) = { post: "/v1/products" body: "product" };
  }

  rpc GetProduct(GetProductRequest) returns (GetProductResponse) {
    option (google.api.http) = { get: "/v1/products/{id}" };
  }

  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {
    option (google.api.http) = { get: "/v1/products" };
  }

  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse) {
    option (google.api.http) = { patch: "/v1/products/{product.id}" body: "product" };
  }

  rpc ArchiveProduct(ArchiveProductRequest) returns (ArchiveProductResponse) {
    option (google.api.http) = { delete: "/v1/products/{id}" };
  }
}

message Product {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  int64 price_minor = 5;
  string currency = 6;
  ProductStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ACTIVE = 1;
  PRODUCT_STATUS_ARCHIVED = 2;
}

message CreateProductRequest { Product product = 1; }
message CreateProductResponse { Product product = 1; }
message GetProductRequest { string id = 1; }
message GetProductResponse { Product product = 1; }

message ListProductsRequest {
  int32 page_size = 1;
  string page_token = 2;
  ProductStatus status = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  string next_page_token = 2;
}

message UpdateProductRequest {
  Product product = 1;
  string update_mask = 2;
}

message UpdateProductResponse { Product product = 1; }
message ArchiveProductRequest { string id = 1; }
message ArchiveProductResponse { google.protobuf.Empty result = 1; }

